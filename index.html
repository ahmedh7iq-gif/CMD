
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نظام إدارة الحسابات</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #17243b;
    }
    header {
      background: #17243b;
      color: white;
      padding: 25px;
      text-align: center;
    }
    main {
      max-width: 480px;
      margin: 35px auto;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px #00000010;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 16px;
    }
    input { border: 1px solid #ddd; }
    button {
      background: #17243b;
      color: white;
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <h2>نظام إدارة الحسابات</h2>
    <p>Apple & Google Accounts</p>
  </header>
  <main>
    <div class="card">
      <h3>لوحة الإدارة</h3>
      <p>مرحباً بك في نظام إدارة حسابات الزبائن</p>
      <input placeholder="اسم المستخدم" disabled>
      <input placeholder="كلمة المرور" type="password" disabled>
      <button disabled>تسجيل الدخول - قريباً</button>
      <p>هذه واجهة تجريبية. سيتم تفعيل الدخول الآمن لاحقاً.</p>
    </div>
  </main>
</body>
</html>
