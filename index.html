<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMD | إدارة الحسابات</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#17243b;font-family:system-ui,Arial}header{background:#17243b;color:white;padding:28px 18px;text-align:center}header h1{margin:0;font-size:25px}header p{opacity:.75}main{max-width:460px;margin:42px auto;padding:0 18px}.card{background:white;border-radius:20px;padding:30px 24px;box-shadow:0 12px 35px #17243b12}h2{margin-top:0}label{display:block;margin:18px 0 7px;font-weight:600}input,button{width:100%;padding:14px;font-size:16px;border-radius:10px}input{border:1px solid #cbd5e1}button{margin-top:22px;background:#17243b;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}.muted{color:#64748b}#message{min-height:25px;margin-top:16px}#panel{display:none}.info{padding:12px 0;border-bottom:1px solid #e2e8f0}#logout{background:#f1f5f9;color:#17243b}</style></head><body>
<header><h1>نظام إدارة الحسابات</h1><p>CMD • لوحة الإدارة</p></header><main>
<section class="card" id="login"><h2>تسجيل الدخول</h2><p class="muted">أدخل بيانات حسابك للمتابعة</p><form id="form"><label for="username">اسم المستخدم</label><input id="username" autocomplete="username" required><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">دخول آمن</button></form><p id="message" role="status"></p></section>
<section class="card" id="panel"><h2>لوحة المدير</h2><p>مرحباً، <strong id="name"></strong></p><div class="info">اسم المستخدم: <span id="user"></span></div><div class="info">الصلاحية: <span id="role"></span></div><p class="muted">تم تفعيل الدخول الآمن. ميزات إدارة الحسابات ستُضاف في المرحلة القادمة.</p><button id="logout">تسجيل الخروج</button></section>
</main><script>
const login=document.getElementById("login"),panel=document.getElementById("panel"),msg=document.getElementById("message");
function show(user){login.style.display=user?"none":"block";panel.style.display=user?"block":"none";if(user){document.getElementById("name").textContent=user.full_name;document.getElementById("user").textContent=user.username;document.getElementById("role").textContent=user.role;}}
async function check(){try{const r=await fetch("/api/me",{credentials:"same-origin",cache:"no-store"});if(r.ok){const d=await r.json();show(d.user)}else show(null)}catch{show(null)}}
document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const btn=document.getElementById("submit");btn.disabled=true;msg.textContent="جاري التحقق...";try{const r=await fetch("/api/login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value,password:document.getElementById("password").value})});const d=await r.json();if(r.ok){document.getElementById("password").value="";msg.textContent="";await check()}else msg.textContent=d.error||"تعذر تسجيل الدخول"}catch{msg.textContent="تعذر الاتصال بالخادم"}finally{btn.disabled=false}});
document.getElementById("logout").addEventListener("click",async()=>{try{await fetch("/api/logout",{method:"POST",credentials:"same-origin"})}finally{show(null)}});check();
</script></body></html>
