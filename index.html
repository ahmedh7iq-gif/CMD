<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMD | إدارة الحسابات</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#17243b;font-family:system-ui,Arial}header{background:#17243b;color:white;padding:25px 18px;text-align:center}header h1{margin:0;font-size:25px}header p{opacity:.8}main{max-width:920px;margin:30px auto;padding:0 16px}.card{background:white;border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:0 8px 25px #17243b0d}h2{margin:0 0 16px;font-size:22px}.muted{color:#64748b}label{display:block;margin:13px 0 6px;font-weight:600}input,select,textarea,button{font:inherit;width:100%;padding:12px;border-radius:9px}input,select,textarea{border:1px solid #cbd5e1;background:white}button{border:0;background:#17243b;color:white;cursor:pointer;margin-top:15px}button:disabled{opacity:.6}.secondary{background:#e9eef5;color:#17243b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f3f5f9;border-radius:12px;padding:15px}.stat strong{display:block;font-size:23px;margin-top:8px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px}.toolbar button{width:auto;margin:0}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:650px;text-align:right}th,td{padding:12px;border-bottom:1px solid #e2e8f0}th{color:#64748b;font-size:13px}#app{display:none}#message,#status{min-height:22px}#logout{width:auto;padding:9px 16px}@media(max-width:560px){.grid,.stats{grid-template-columns:1fr}.card{padding:18px}}</style></head><body>
<header><h1>نظام إدارة الحسابات</h1><p>CMD • Apple & Google</p></header><main>
<section class="card" id="login"><h2>تسجيل الدخول</h2><form id="loginForm"><label>اسم المستخدم</label><input id="username" autocomplete="username" required><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn">دخول آمن</button></form><p id="message" role="status"></p></section>
<div id="app"><section class="card"><div class="toolbar"><div><h2>لوحة المدير</h2><p class="muted">مرحباً، <strong id="name"></strong></p></div><button id="logout" class="secondary">خروج</button></div><div class="stats"><div class="stat">الحسابات المسجلة<strong id="count">—</strong></div><div class="stat">إجمالي المبيعات<strong id="sales">—</strong></div><div class="stat">الربح الإجمالي<strong id="profit">—</strong></div></div></section>
<section class="card"><h2>إضافة عملية بيع حساب</h2><p class="muted">كل حساب يُسجّل كعملية مستقلة. لا تكتب كلمة مرور Apple أو Google هنا.</p><form id="accountForm"><div class="grid"><div><label>نوع الحساب</label><select id="type"><option value="apple">Apple</option><option value="google">Google</option></select></div><div><label>اسم الزبون</label><input id="customer" maxlength="120" required></div><div><label>بريد الحساب</label><input id="email" type="email" maxlength="254" required></div><div><label>سعر البيع (د.ع)</label><input id="price" type="number" min="0" max="1000000000" value="0" required></div><div><label>التكلفة (د.ع) — للمدير فقط</label><input id="cost" type="number" min="0" max="1000000000" value="0" required></div><div><label>ملاحظات غير سرية</label><textarea id="notes" maxlength="1000" rows="2"></textarea></div></div><button id="save">حفظ الحساب</button></form><p id="status" role="status"></p></section>
<section class="card"><div class="toolbar"><h2>الحسابات المسجلة</h2><button class="secondary" id="refresh">تحديث</button></div><p class="muted" id="listStatus"></p><div class="tablewrap"><table><thead><tr><th>الرقم</th><th>النوع</th><th>الزبون</th><th>البريد</th><th>السعر</th><th>الربح</th></tr></thead><tbody id="rows"></tbody></table></div></section></div>
</main><script>
const el=id=>document.getElementById(id);let currentUser=null;
async function api(path,options={}){const r=await fetch(path,{credentials:"same-origin",cache:"no-store",...options});let d;try{d=await r.json()}catch{throw Error("استجابة غير صالحة من الخادم")};if(!r.ok)throw Error(d.error||"فشل الطلب");return d}
function show(user){currentUser=user;el("login").style.display=user?"none":"block";el("app").style.display=user?"block":"none";if(user)el("name").textContent=user.full_name}
async function check(){try{const d=await api("/api/me");show(d.user);if(d.user.role==="owner")await load();else el("listStatus").textContent="هذه اللوحة للمالك فقط"}catch{show(null)}}
const fmt=n=>new Intl.NumberFormat("ar-IQ").format(n)+" د.ع";
async function load(){el("listStatus").textContent="جاري تحميل البيانات...";try{const d=await api("/api/accounts");const a=d.accounts;el("count").textContent=a.length+(a.length===200?"+":"");el("sales").textContent=fmt(a.reduce((s,x)=>s+x.sale_price_iqd,0));el("profit").textContent=fmt(a.reduce((s,x)=>s+x.sale_price_iqd-x.cost_iqd,0));el("rows").replaceChildren();for(const x of a){const tr=document.createElement("tr");for(const v of [x.id,x.account_type==="apple"?"Apple":"Google",x.customer_name,x.account_email,fmt(x.sale_price_iqd),fmt(x.sale_price_iqd-x.cost_iqd)]){const td=document.createElement("td");td.textContent=v;tr.append(td)}el("rows").append(tr)}el("listStatus").textContent=a.length?"آخر "+a.length+" عملية مسجلة":"لا توجد حسابات مسجلة بعد"}catch(e){el("listStatus").textContent=e.message;el("count").textContent="—";el("sales").textContent="—";el("profit").textContent="—"}}
el("loginForm").addEventListener("submit",async e=>{e.preventDefault();el("loginBtn").disabled=true;el("message").textContent="جاري التحقق...";try{await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:el("username").value,password:el("password").value})});el("password").value="";el("message").textContent="";await check()}catch(e){el("message").textContent=e.message}finally{el("loginBtn").disabled=false}});
el("accountForm").addEventListener("submit",async e=>{e.preventDefault();el("save").disabled=true;el("status").textContent="جاري الحفظ...";try{const d=await api("/api/accounts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({account_type:el("type").value,customer_name:el("customer").value,account_email:el("email").value,sale_price_iqd:Number(el("price").value),cost_iqd:Number(el("cost").value),notes:el("notes").value})});el("status").textContent="تم حفظ العملية رقم "+d.id;el("accountForm").reset();await load()}catch(e){el("status").textContent=e.message}finally{el("save").disabled=false}});
el("refresh").onclick=load;el("logout").onclick=async()=>{try{await api("/api/logout",{method:"POST"})}catch{}show(null)};check();
</script></body></html>
