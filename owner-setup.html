
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إعداد حساب المدير</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      margin: 0;
      padding: 24px;
      color: #17243b;
    }
    .card {
      max-width: 420px;
      margin: 55px auto;
      padding: 28px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px #17243b15;
    }
    h2 { text-align: center; }
    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: bold;
    }
    input, button {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      font-size: 16px;
    }
    input { border: 1px solid #ccd3df; }
    button {
      margin-top: 24px;
      background: #17243b;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #message {
      margin-top: 18px;
      text-align: center;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>إنشاء حساب المدير</h2>
    <p>هذه الصفحة مخصصة للإعداد الأول فقط.</p>

    <label>الاسم الكامل</label>
    <input value="Ahmed Rasheed" readonly>

    <label>اسم المستخدم</label>
    <input value="h7iq" readonly>

    <form id="setupForm">
      <label>مفتاح الإعداد السري</label>
      <input id="secret" type="password"
        autocomplete="off" required>

      <label>كلمة مرور المدير</label>
      <input id="password" type="password"
        minlength="16" maxlength="128"
        autocomplete="new-password" required>

      <label>تأكيد كلمة المرور</label>
      <input id="confirm" type="password"
        autocomplete="new-password" required>

      <button id="submit" type="submit">
        إنشاء حساب المدير
      </button>
    </form>

    <p id="message" role="status"></p>
  </div>

  <script>
    const form = document.getElementById("setupForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submit");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const secret = document.getElementById("secret").value;
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password !== confirm) {
        message.textContent = "كلمتا المرور غير متطابقتين";
        return;
      }

      if (password.length < 16 || password.length > 128) {
        message.textContent = "كلمة المرور يجب أن تكون بين 16 و128 حرفاً";
        return;
      }

      button.disabled = true;
      message.textContent = "جاري إنشاء الحساب...";

      try {
        const response = await fetch("/api/setup-owner", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Setup-Secret": secret
          },
          body: JSON.stringify({ password })
        });

        const raw = await response.text();

let data;

try {
  data = JSON.parse(raw);
} catch {
  throw new Error(
    "الخادم أعاد استجابة غير متوقعة. HTTP " +
    response.status
  );
}

        if (response.status === 201 && data.success) {
          message.textContent = "تم إنشاء حساب المدير بنجاح";
          form.reset();
        } else {
          message.textContent =
            data.error || "تعذر إنشاء الحساب";
        }
} catch (error) {
  message.textContent =
    "تعذر إكمال الطلب: " + error.message;
} finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
