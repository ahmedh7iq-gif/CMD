<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>CMD | تسليم الحساب</title><style>*{box-sizing:border-box}body{font-family:system-ui,Arial;background:linear-gradient(140deg,#0e1c35,#253e67);color:#1a2b45;min-height:100vh;margin:0;display:grid;place-items:center;padding:20px}.card{width:min(100%,440px);background:white;border-radius:24px;padding:32px;box-shadow:0 25px 70px #0004}.brand{letter-spacing:4px;color:#4565a5;font-weight:900}h1{font-size:24px}p{color:#65748b;line-height:1.8}label{font-weight:700}input,button{width:100%;padding:14px;border-radius:12px;font:inherit;margin-top:12px}input{border:1px solid #c9d3e4;text-align:center;letter-spacing:8px;direction:ltr}button{border:0;background:#172c50;color:white;font-weight:700}button:disabled{opacity:.5}.info{padding:14px;background:#f2f6fc;border-radius:12px;margin-top:12px;overflow-wrap:anywhere}#result{margin-top:15px;white-space:pre-wrap}#profileForm input{letter-spacing:normal;direction:auto;text-align:start}summary{cursor:pointer;margin:16px 0}</style></head><body><main class="card"><div class="brand">CMD / SECURE DELIVERY</div><h1>تسليم حسابك</h1><p>أدخل رمز الحماية المكوّن من 6 أرقام الذي استلمته من CMD. بعد انتهاء القفل المؤقت تتاح محاولة واحدة فقط.</p><form id="form"><label for="pin">رمز PIN</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" required><button id="submit">فتح بيانات الحساب</button></form><div id="result" role="status"></div><section id="info" hidden><div class="info">اسم الزبون: <strong id="name"></strong></div><div class="info">بريد الحساب: <strong id="email"></strong></div><div class="info">الاسم المرتبط بالحساب: <strong id="accountName"></strong></div><div class="info">تاريخ الميلاد: <strong id="birthDate"></strong></div><div class="info">العنوان: <strong id="address"></strong></div><div class="info">كلمة المرور المحفوظة: <strong id="secret">مخفية</strong></div><button type="button" id="reveal">إظهار كلمة المرور</button><div class="info">رقم الهاتف: <strong id="phone"></strong></div>
<details id="editor"><summary>تعديل بياناتي في CMD</summary><form id="profileForm">
<label for="cust">اسم الزبون</label><input id="cust" type="text" maxlength="120" required >
<label for="mail">بريد الحساب</label><input id="mail" type="email" maxlength="254" required >
<label for="full">الاسم المرتبط بالحساب</label><input id="full" type="text" maxlength="150"  >
<label for="dob">تاريخ الميلاد</label><input id="dob" type="date" maxlength="10"  >
<label for="tel">رقم الهاتف</label><input id="tel" type="tel" maxlength="40"  >
<label for="addr">العنوان</label><input id="addr" type="text" maxlength="500"  >
<label for="current">رمز PIN الحالي</label><input id="current" type="password" maxlength="6" required pattern="[0-9]{6}" inputmode="numeric" autocomplete="off">
<label for="next">رمز PIN جديد (اختياري)</label><input id="next" type="password" maxlength="6"  pattern="[0-9]{6}" inputmode="numeric" autocomplete="off">
<button id="saveProfile">حفظ التعديلات</button></form></details></section></main><script>const token=new URL(location.href).searchParams.get("t");if(token)history.replaceState(null,"",location.pathname);const $=id=>document.getElementById(id);let ticket=null;async function credential(body){const r=await fetch("/api/delivery-credentials",{method:"POST",headers:{"Content-Type":"application/json"},cache:"no-store",body:JSON.stringify({...body,ticket})});const d=await r.json();if(!r.ok)throw Error(d.error||"تعذر التنفيذ");return d} $("reveal").onclick=async()=>{try{const d=await credential({mode:"read"});$("secret").textContent=d.password??"لم تُسجّل كلمة مرور بعد"}catch(e){$("result").textContent=e.message}};async function post(path,body){
 const response=await fetch("/api/"+path,{method:"POST",headers:{"Content-Type":"application/json"},cache:"no-store",body:JSON.stringify(body)});
 const data=await response.json();if(!response.ok)throw Error(data.error||"تعذر الحفظ");return data;
}
$("profileForm").onsubmit=async event=>{
 event.preventDefault();$("saveProfile").disabled=true;
 try{
 const proof=await post("delivery-access",{token,pin:$("current").value,purpose:"update"});
 await post("delivery-profile",{mode:"update",ticket:proof.ticket,customer_name:$("cust").value,account_email:$("mail").value,account_full_name:$("full").value,phone:$("tel").value,birth_date:$("dob").value,address:$("addr").value,new_pin:$("next").value});
 ticket=null;$("info").hidden=true;$("secret").textContent="مخفية";$("profileForm").reset();$("result").textContent="تم الحفظ. افتح بياناتك برمز PIN على نفس الوصل.";
 }catch(error){$("result").textContent=error.message}finally{$("current").value="";$("saveProfile").disabled=false}
};$("form").onsubmit=async e=>{e.preventDefault();$("submit").disabled=true;$("result").textContent="جاري التحقق...";$("info").hidden=true;try{const r=await fetch("/api/delivery-access",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,pin:$("pin").value}),cache:"no-store"});const d=await r.json();$("pin").value="";if(!r.ok){$("result").textContent=d.error+(d.retry_after_seconds?" — الوقت المتبقي: "+Math.ceil(d.retry_after_seconds/60)+" دقيقة":"")+(d.remaining_attempts!==undefined?" — المحاولات المتبقية: "+d.remaining_attempts:"");return}ticket=d.ticket;const p=await post("delivery-profile",{mode:"read",ticket});
 for(const [view,input,value] of [["accountName","full",p.account_full_name],["birthDate","dob",p.birth_date],["address","addr",p.address],["phone","tel",p.phone]]){$(view).textContent=value||"غير مسجل";$(input).value=value||""}
 $("cust").value=d.customer_name;$("mail").value=d.account_email;$("secret").textContent="مخفية";$("result").textContent="تم التحقق بنجاح";$("name").textContent=d.customer_name;$("email").textContent=d.account_email;$("info").hidden=false}catch{$("result").textContent="تعذر الاتصال بالخادم"}finally{$("submit").disabled=false}};</script></body></html>
